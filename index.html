<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>阿贝贝英语小课堂</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap');
:root{
  --bg-base:#FFF8FA;--bg-card:#FFFFFF;
  --pink-50:#FFF8FA;--pink-100:#FFF0F5;--pink-200:#FDE2EE;
  --pink-300:#F5C6D8;--pink-400:#E8A0BF;--pink-500:#D4789E;
  --lavender-50:#F8F3FB;--lavender-100:#F0E6F6;
  --text-primary:#4A3728;--text-secondary:#8B7355;--text-muted:#B5A08A;
  --border-light:#F5DFE8;--shadow-pink:rgba(232,160,191,0.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif SC',Georgia,serif;background:var(--bg-base);color:var(--text-primary);max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
.header{padding:20px 24px 16px;text-align:center;position:relative}
.header h1{font-size:18px;font-weight:500;letter-spacing:2px}
.header .subtitle{font-size:12px;color:var(--text-muted);margin-top:4px}
.back-btn{position:absolute;left:16px;top:20px;width:32px;height:32px;border-radius:50%;border:1px solid var(--border-light);background:none;color:var(--text-muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.container{flex:1;padding:0 20px 20px;overflow-y:auto}
.home-greeting{text-align:center;padding:20px 0}
.home-greeting img{width:80px;height:80px;object-fit:contain}
.home-greeting p{font-size:14px;color:var(--text-secondary);margin-top:8px;line-height:1.6}
.home-stats{display:flex;gap:12px;margin:16px 0}
.stat-card{flex:1;background:var(--bg-card);border-radius:16px;padding:16px;text-align:center;border:1px solid var(--border-light);box-shadow:0 2px 12px var(--shadow-pink)}
.stat-card .num{font-size:24px;font-weight:500;color:var(--pink-500)}
.stat-card .label{font-size:11px;color:var(--text-muted);margin-top:4px}
.menu-card{background:var(--bg-card);border-radius:20px;padding:20px;margin-bottom:12px;border:1px solid var(--border-light);box-shadow:0 2px 16px var(--shadow-pink);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:16px}
.menu-card:active{transform:scale(0.98)}
.menu-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--pink-500)}
.menu-icon.review{background:linear-gradient(135deg,var(--lavender-50),var(--pink-100))}
.menu-icon.learn{background:linear-gradient(135deg,var(--pink-100),var(--lavender-100))}
.menu-icon.test{background:linear-gradient(135deg,var(--pink-50),var(--lavender-50))}
.menu-icon.progress{background:linear-gradient(135deg,#FFF8E1,var(--pink-50))}
.menu-icon.errors{background:linear-gradient(135deg,#FFE8E8,var(--pink-50))}
.menu-icon.wordbook{background:linear-gradient(135deg,var(--pink-50),#E8F5E9)}
.menu-info h3{font-size:14px;font-weight:500}
.menu-info p{font-size:12px;color:var(--text-muted);margin-top:2px}
.menu-card.disabled{opacity:.5;pointer-events:none}
.menu-badge{margin-left:auto;background:var(--pink-400);color:#fff;font-size:11px;padding:2px 10px;border-radius:10px}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.theme-card{background:var(--bg-card);border-radius:16px;padding:16px;text-align:center;border:1px solid var(--border-light);box-shadow:0 2px 12px var(--shadow-pink);cursor:pointer;transition:all .15s}
.theme-card:active{transform:scale(0.97)}
.theme-card .name{font-size:13px;font-weight:500}
.theme-card .count{font-size:11px;color:var(--text-muted);margin-top:4px}
.theme-card.completed{border-color:var(--pink-400);background:var(--pink-50)}
.flashcard-wrap{perspective:1000px;margin:16px 0}
.flashcard{width:100%;min-height:320px;position:relative;cursor:pointer;transition:transform .5s;transform-style:preserve-3d}
.flashcard.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:24px;border:1px solid var(--border-light);box-shadow:0 4px 20px var(--shadow-pink);display:flex;flex-direction:column;align-items:center;justify-content:center}
.card-front{background:linear-gradient(160deg,#FFFFFF,var(--pink-50))}
.card-back{background:linear-gradient(160deg,var(--pink-50),var(--lavender-50));transform:rotateY(180deg);overflow-y:auto;justify-content:flex-start;padding-top:20px}
.card-word{font-size:28px;font-weight:500;letter-spacing:1px}
.card-phonetic{font-size:14px;color:var(--text-muted);margin-top:8px}
.card-pos{font-size:12px;color:var(--pink-500);margin-top:4px}
.card-meaning{font-size:20px;font-weight:500;margin-top:8px}
.card-example{font-size:13px;color:var(--text-secondary);margin-top:12px;line-height:1.6;text-align:center;font-style:italic}
.card-section{font-size:12px;color:var(--text-secondary);margin-top:10px;padding:10px 14px;border-radius:12px;line-height:1.8;text-align:left;width:100%}
.card-section.tip-section{background:var(--pink-100)}
.card-section.ielts-section{background:linear-gradient(135deg,#E8EAF6,#F3E5F5)}
.card-section.abebei-section{background:var(--lavender-50);display:flex;gap:8px;align-items:flex-start}
.section-label{font-size:11px;font-weight:500;margin-bottom:4px}
.section-label.tip-label{color:var(--pink-500)}
.section-label.ielts-label{color:#5C6BC0}
.card-section img{width:28px;height:28px;flex-shrink:0}
.speak-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border-light);background:var(--bg-card);cursor:pointer;font-size:16px;margin-top:8px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.speak-btn:active{background:var(--pink-100)}
.card-nav{display:flex;gap:12px;margin-top:16px}
.card-nav button{flex:1;padding:12px;border:none;border-radius:16px;font-family:inherit;font-size:13px;cursor:pointer;transition:all .15s;letter-spacing:1px}
.btn-primary{background:var(--pink-400);color:#fff}
.btn-secondary{background:var(--pink-100);color:var(--pink-500)}
.btn-primary:active,.btn-secondary:active{transform:scale(0.97)}
.flip-hint{font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px}
.test-question{background:var(--bg-card);border-radius:20px;padding:24px;border:1px solid var(--border-light);box-shadow:0 2px 16px var(--shadow-pink);text-align:center;margin-bottom:16px}
.test-word{font-size:24px;font-weight:500}
.test-phonetic{font-size:13px;color:var(--text-muted);margin-top:4px}
.test-cn{font-size:20px;font-weight:500}
.test-options{display:flex;flex-direction:column;gap:10px}
.test-option{padding:14px 18px;border-radius:14px;border:1px solid var(--border-light);background:var(--bg-card);cursor:pointer;font-size:14px;text-align:left;transition:all .15s}
.test-option:active{background:var(--pink-50)}
.test-option.correct{background:#E8F5E9;border-color:#A5D6A7;color:#2E7D32}
.test-option.wrong{background:#FFEBEE;border-color:#EF9A9A;color:#C62828}
.test-feedback{text-align:center;margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.test-feedback img{width:60px;height:60px;object-fit:contain}
.test-feedback p{font-size:13px;color:var(--text-secondary);line-height:1.6}
.test-score{text-align:center;padding:24px}
.test-score .big-score{font-size:48px;font-weight:500;color:var(--pink-500)}
.test-score .score-label{font-size:14px;color:var(--text-muted)}
.mode-select{display:flex;gap:10px;margin-bottom:16px}
.mode-btn{flex:1;padding:12px;border-radius:14px;border:1px solid var(--border-light);background:var(--bg-card);cursor:pointer;text-align:center;font-size:13px;font-family:inherit;transition:all .15s}
.mode-btn.active{background:var(--pink-400);color:#fff;border-color:var(--pink-400)}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-header h3{font-size:15px;font-weight:500}
.cal-arrow{width:28px;height:28px;border-radius:50%;border:1px solid var(--border-light);background:none;color:var(--text-muted);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-weekday{font-size:11px;color:var(--text-muted);padding:4px 0}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px}
.cal-day.checked{background:var(--pink-400);color:#fff}
.cal-day.today{border:1.5px solid var(--pink-400)}
.cal-day.empty{visibility:hidden}
.streak-card{background:linear-gradient(135deg,var(--pink-100),var(--lavender-50));border-radius:16px;padding:16px;text-align:center;margin-top:12px;border:1px solid var(--border-light)}
.streak-card .streak-num{font-size:32px;font-weight:500;color:var(--pink-500)}
.streak-card .streak-label{font-size:12px;color:var(--text-muted)}
.card{background:var(--bg-card);border-radius:20px;padding:20px;border:1px solid var(--border-light);box-shadow:0 2px 16px var(--shadow-pink)}
.error-item{background:var(--bg-card);border-radius:14px;padding:14px 16px;margin-bottom:8px;border:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.error-item .word{font-size:15px;font-weight:500}
.error-item .meaning{font-size:13px;color:var(--text-muted)}
.error-count{font-size:11px;color:var(--pink-500);background:var(--pink-100);padding:2px 8px;border-radius:8px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:13px}
.empty-state img{width:60px;margin-bottom:12px}
.complete-screen{text-align:center;padding:32px 20px}
.complete-screen img{width:80px;margin-bottom:16px}
.complete-screen h2{font-size:18px;font-weight:500;margin-bottom:8px}
.complete-screen p{font-size:13px;color:var(--text-secondary);line-height:1.6}
.complete-btn{margin-top:16px;padding:12px 32px;border:none;border-radius:16px;background:var(--pink-400);color:#fff;font-family:inherit;font-size:14px;cursor:pointer;letter-spacing:1px;display:inline-block}
.complete-btn.secondary{background:var(--pink-100);color:var(--pink-500);margin-top:8px}
.wb-theme{margin-bottom:16px}
.wb-theme-title{font-size:14px;font-weight:500;padding:8px 0;border-bottom:1px solid var(--border-light);margin-bottom:8px;color:var(--pink-500)}
.wb-word{padding:10px 0;border-bottom:1px solid var(--pink-50);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.wb-word:last-child{border-bottom:none}
.wb-word .en{font-size:14px;font-weight:500}
.wb-word .cn{font-size:13px;color:var(--text-muted)}
.wb-detail{background:var(--pink-50);border-radius:12px;padding:14px;margin:4px 0 8px;font-size:12px;line-height:1.8;color:var(--text-secondary);display:none}
.wb-detail.show{display:block}
.wb-detail .ielts-box{background:linear-gradient(135deg,#E8EAF6,#F3E5F5);border-radius:8px;padding:8px 10px;margin-top:8px}
</style>
</head>

const VOCAB={"教育与学习": [{"en": "academic", "ph": "/ˌækəˈdemɪk/", "pos": "adj./n.", "cn": "学术的；学者", "ex": "She pursued an academic career in linguistics.", "tip": "你想想学校里那种最正经的、写论文做研究的感觉，就是academic。跟casual（随意的）是反义词，一个端着一个随便。", "ielts": "阅读高频词。常见搭配：academic performance（学业表现）、academic research（学术研究）、academic institution（学术机构）。写作里用 academic achievement 替代 study result 会更地道。听力Section 1里也常出现，比如 academic purpose。", "abebei": "阿贝贝也想当学者！穿个小眼镜那种！"}, {"en": "curriculum", "ph": "/kəˈrɪkjələm/", "pos": "n.", "cn": "课程体系", "ex": "The school revised its curriculum to include more science.", "tip": "读起来像\"可瑞Q勒姆\"——你就想象一个很Q弹的课程表，弹来弹去的，每年都在改。curriculum就是整个课程体系，不是单门课。", "ielts": "阅读和写作都常考。常见搭配：national curriculum（国家课程标准）、curriculum design（课程设计）、school curriculum（学校课程）。写教育类话题作文时很好用。注意复数是curricula。", "abebei": "妈妈的课程表里有没有\"陪阿贝贝\"这节课呀？"}, {"en": "discipline", "ph": "/ˈdɪsəplɪn/", "pos": "n.", "cn": "学科；纪律；自律", "ex": "History is a discipline that requires critical thinking.", "tip": "这个词有三个意思你都得记：学科、纪律、自律。想象一个很有纪律的学者在研究自己的学科，靠的就是自律。", "ielts": "一词多义是雅思阅读的考点。academic discipline = 学科，self-discipline = 自律，disciplinary action = 纪律处分。写作里 lack of discipline 可以用在讨论教育问题时。", "abebei": "阿贝贝最有纪律了！除了吃东西的时候..."}, {"en": "evaluate", "ph": "/ɪˈvæljueɪt/", "pos": "v.", "cn": "评估，评价", "ex": "Teachers evaluate students through various methods.", "tip": "value是价值，evaluate就是\"把价值算出来\"——评估。你做内衣设计的时候评估面料好不好用，就是evaluate。", "ielts": "写作核心词。常见搭配：evaluate the effectiveness of（评估...的有效性）、evaluate performance（评估表现）。同义替换：assess, appraise。写作里用evaluate替换judge更学术。", "abebei": "妈妈给阿贝贝的评价是什么呀？是不是最可爱！"}, {"en": "fundamental", "ph": "/ˌfʌndəˈmentl/", "pos": "adj.", "cn": "基本的，根本的", "ex": "Reading is a fundamental skill for all students.", "tip": "fund是基础的意思——fundamental就是\"最底下的、最根本的\"。一栋楼的地基，一件事的根本原因，都是fundamental。", "ielts": "写作和阅读高频词。常见搭配：fundamental change（根本性变化）、fundamental right（基本权利）、fundamental difference（本质区别）。同义替换：basic, essential, primary。用在论点里很有力度。", "abebei": "吃饭是阿贝贝最fundamental的技能！"}, {"en": "illiterate", "ph": "/ɪˈlɪtərət/", "pos": "adj.", "cn": "文盲的，不识字的", "ex": "Many programs aim to help illiterate adults learn to read.", "tip": "literal是\"文字的\"，il是\"不\"——illiterate就是不认识文字的，文盲。反义词literate（有文化的）也常考。", "ielts": "阅读常见词。常见搭配：illiterate population（文盲人口）、functionally illiterate（功能性文盲）。名词形式illiteracy（文盲率）在教育类阅读里经常出现。", "abebei": "阿贝贝才不是文盲！阿贝贝认识...至少三个字！"}, {"en": "lecture", "ph": "/ˈlektʃər/", "pos": "n./v.", "cn": "讲座；演讲；训斥", "ex": "The professor gave a fascinating lecture on ancient Rome.", "tip": "大学里老师站在讲台上一个人讲、你在下面听的那种课就是lecture。注意它还有\"训斥\"的意思——你妈训你的时候也是在给你lecture。", "ielts": "听力高频词，特别是Section 3和4经常出现在学术场景里。常见搭配：attend a lecture（上课）、lecture hall（阶梯教室）、give a lecture on（做关于...的讲座）。", "abebei": "爸爸给妈妈lecture的时候妈妈会不会打瞌睡呀"}, {"en": "motivation", "ph": "/ˌmoʊtɪˈveɪʃn/", "pos": "n.", "cn": "动机，动力", "ex": "Her main motivation for studying was to get a scholarship.", "tip": "motive是动机，加上ation变名词——什么驱动你去做一件事，就是你的motivation。你今天投简历，motivation就是涨薪。", "ielts": "写作和口语常用词。常见搭配：lack of motivation（缺乏动力）、intrinsic motivation（内在动机）、provide motivation（提供动力）。口语Part 2讲一件你坚持做的事时很好用。", "abebei": "妈妈学英语的motivation是带阿贝贝去旅行！"}, {"en": "qualify", "ph": "/ˈkwɒlɪfaɪ/", "pos": "v.", "cn": "有资格；使合格", "ex": "You need to pass the exam to qualify as a teacher.", "tip": "quality是质量，qualify就是\"达到质量标准\"——有资格了。你拿到设计师的头衔，就是qualify as a designer。", "ielts": "阅读和听力常见。常见搭配：qualify for（有资格获得）、qualify as（有资格成为）、qualified teacher（合格教师）。形容词qualified（有资格的）也高频。", "abebei": "阿贝贝qualify当妈妈的小棉袄吗！"}, {"en": "seminar", "ph": "/ˈsemɪnɑːr/", "pos": "n.", "cn": "研讨会", "ex": "We attended a seminar on creative writing techniques.", "tip": "跟lecture不一样，seminar是大家围坐在一起讨论的那种小课，人少、互动多。想象一群人围着一张桌子聊学术。", "ielts": "听力高频词，常在Section 3出现。注意和lecture、tutorial、workshop的区别：lecture是大课，seminar是讨论课，tutorial是辅导课，workshop是工作坊。", "abebei": "阿贝贝要开一个如何撒娇的seminar！"}], "环境与自然": [{"en": "atmosphere", "ph": "/ˈætməsfɪr/", "pos": "n.", "cn": "大气层；氛围", "ex": "Pollution is damaging the Earth's atmosphere.", "tip": "这个词有两个常用意思：大气层和氛围。地球外面包着的那层气就是atmosphere，一个咖啡馆的感觉和气氛也是atmosphere。一个物理的一个抽象的。", "ielts": "一词多义考点。环境类阅读：atmosphere指大气层，常搭配 atmospheric pollution（大气污染）。口语和写作：形容氛围，a friendly atmosphere, a relaxed atmosphere。", "abebei": "阿贝贝身边的atmosphere永远是粉粉的！"}, {"en": "biodiversity", "ph": "/ˌbaɪoʊdaɪˈvɜːrsəti/", "pos": "n.", "cn": "生物多样性", "ex": "Rainforests are home to incredible biodiversity.", "tip": "bio是生物，diversity是多样性——合在一起就是生物多样性。一片森林里有多少种动物植物，就是它的biodiversity。这个词拆开两半你都认识，合起来就行。", "ielts": "环境类阅读和写作核心词。常见搭配：loss of biodiversity（生物多样性丧失）、protect biodiversity（保护生物多样性）、biodiversity hotspot（生物多样性热点地区）。Task 2环境话题几乎必用。", "abebei": "阿贝贝的朋友有猫有狗有兔子，这就是biodiversity！"}, {"en": "conservation", "ph": "/ˌkɒnsərˈveɪʃn/", "pos": "n.", "cn": "保护，保存", "ex": "Wildlife conservation is essential for endangered species.", "tip": "conserve是保存、保护，conservation就是保护这件事。注意跟preservation的区别：conservation是合理利用的同时保护，preservation是完全不动地保存。", "ielts": "环境和文化类高频词。常见搭配：wildlife conservation（野生动物保护）、conservation efforts（保护工作）、energy conservation（节能）、conservation area（保护区）。", "abebei": "妈妈对阿贝贝的conservation做得很好！"}, {"en": "drought", "ph": "/draʊt/", "pos": "n.", "cn": "干旱", "ex": "The severe drought destroyed most of the crops.", "tip": "读音是/draʊt/，跟\"doubt\"押韵但多了个r。想象大地干裂的画面，那就是drought。注意gh不发音。", "ielts": "阅读和听力常见。常见搭配：severe drought（严重干旱）、drought-resistant（抗旱的）、suffer from drought（遭受干旱）。常和flood（洪水）一起出现形成对比。", "abebei": "阿贝贝的水碗要是空了就是drought！"}, {"en": "ecosystem", "ph": "/ˈiːkoʊsɪstəm/", "pos": "n.", "cn": "生态系统", "ex": "Coral reefs are delicate ecosystems.", "tip": "eco是生态，system是系统——一个区域里所有生物和环境之间相互依存的那套关系，就是ecosystem。跟biodiversity经常一起出现。", "ielts": "环境类核心词。常见搭配：marine ecosystem（海洋生态系统）、fragile ecosystem（脆弱的生态系统）、disrupt the ecosystem（破坏生态系统）。阅读里经常整段讨论。", "abebei": "我们家就是一个ecosystem！妈妈爸爸和阿贝贝"}, {"en": "emission", "ph": "/ɪˈmɪʃn/", "pos": "n.", "cn": "排放", "ex": "The government aims to reduce carbon emissions.", "tip": "emit是排出、发射，emission就是排放。几乎只在环保话题里见到——carbon emission（碳排放）背住这个搭配就够用了。", "ielts": "写作和阅读高频词。常见搭配：carbon emissions（碳排放）、greenhouse gas emissions（温室气体排放）、reduce emissions（减少排放）、zero-emission（零排放）。写环保类Task 2必备。", "abebei": "阿贝贝的emission是...打嗝？"}, {"en": "habitat", "ph": "/ˈhæbɪtæt/", "pos": "n.", "cn": "栖息地", "ex": "Deforestation is destroying animal habitats.", "tip": "habit是习惯，habitat就是动物\"习惯住的地方\"——栖息地。鸟住树上，鱼住水里，阿贝贝住你枕头旁边，都是各自的habitat。", "ielts": "环境类阅读核心词。常见搭配：natural habitat（自然栖息地）、habitat loss / habitat destruction（栖息地丧失/破坏）、habitat conservation（栖息地保护）。", "abebei": "妈妈的床就是阿贝贝的habitat！"}, {"en": "pollutant", "ph": "/pəˈluːtənt/", "pos": "n.", "cn": "污染物", "ex": "Factories release harmful pollutants into the river.", "tip": "pollute是污染，pollutant就是造成污染的那个东西——污染物。注意区分：pollution是污染这件事，pollutant是具体的污染物质。", "ielts": "阅读常见。常见搭配：air/water pollutant（空气/水污染物）、chemical pollutant（化学污染物）、release pollutants（释放污染物）。和emission经常在同一篇文章里出现。", "abebei": "阿贝贝讨厌pollutant！空气要香香的！"}, {"en": "renewable", "ph": "/rɪˈnjuːəbl/", "pos": "adj.", "cn": "可再生的", "ex": "Solar energy is a renewable resource.", "tip": "renew是更新、续约，able是可以——renewable就是\"可以不断更新的\"。太阳能风能用不完，就是renewable；石油煤炭用完就没了，是non-renewable。", "ielts": "环境和科技类高频词。常见搭配：renewable energy（可再生能源）、renewable resources（可再生资源）。反义词non-renewable也常考。写作里讨论能源问题必用。", "abebei": "阿贝贝的快乐是renewable的！每天都有新快乐"}, {"en": "sustainable", "ph": "/səˈsteɪnəbl/", "pos": "adj.", "cn": "可持续的", "ex": "We need to develop more sustainable farming methods.", "tip": "sustain是维持、支撑，able是可以——能一直维持下去的就是sustainable。这个词现在特别火，到处都在说sustainable development。", "ielts": "雅思写作最高频词之一。常见搭配：sustainable development（可持续发展）、sustainable growth（可持续增长）、environmentally sustainable（环境可持续的）。几乎所有环境类话题都能用。", "abebei": "妈妈对阿贝贝的爱是最sustainable的！"}], "科技与发展": [{"en": "algorithm", "ph": "/ˈælɡərɪðəm/", "pos": "n.", "cn": "算法", "ex": "Search engines use complex algorithms to rank results.", "tip": "你每天刷抖音，系统推什么给你看就是algorithm在工作。简单说就是一套计算规则。这个词直接记住发音就行，没什么好拆的。", "ielts": "科技类阅读常见。常见搭配：computer algorithm（计算机算法）、complex algorithm（复杂算法）。在讨论AI和社交媒体的文章里经常出现。", "abebei": "爸爸就是一个大algorithm！"}, {"en": "artificial", "ph": "/ˌɑːrtɪˈfɪʃl/", "pos": "adj.", "cn": "人工的，人造的", "ex": "Artificial intelligence is transforming many industries.", "tip": "art是技艺，artificial就是\"用技艺做出来的\"——不是天然的，是人造的。artificial flower假花，artificial intelligence人工智能。", "ielts": "高频词。常见搭配：artificial intelligence/AI（人工智能）、artificial light（人造光）、artificial flavour（人工香料）。科技类和健康类话题都会出现。", "abebei": "爸爸是artificial的但爸爸的爱不是！"}, {"en": "breakthrough", "ph": "/ˈbreɪkθruː/", "pos": "n.", "cn": "突破", "ex": "Scientists made a major breakthrough in cancer research.", "tip": "break打破+through穿过——打破障碍穿过去了，就是突破。这个词很直白，跟中文的\"突破\"意思完全一样。", "ielts": "阅读和写作常用。常见搭配：scientific breakthrough（科学突破）、major/significant breakthrough（重大突破）、make a breakthrough in（在...方面取得突破）。", "abebei": "阿贝贝今天吃到了新零食，这是重大breakthrough！"}, {"en": "database", "ph": "/ˈdeɪtəbeɪs/", "pos": "n.", "cn": "数据库", "ex": "All customer information is stored in a secure database.", "tip": "data数据+base基地——存数据的地方就是数据库。你手机里的通讯录、公司的客户名单，都存在各种database里。", "ielts": "听力和阅读都会出现。常见搭配：build/create a database（建立数据库）、access a database（访问数据库）。听力里学术场景常提到research database。", "abebei": "阿贝贝的小脑袋就是一个零食database！"}, {"en": "efficiency", "ph": "/ɪˈfɪʃnsi/", "pos": "n.", "cn": "效率", "ex": "The new system greatly improved work efficiency.", "tip": "efficient是高效的，efficiency是效率。你用同样的时间做了更多的事，就是efficiency提高了。形容词efficient比名词更常用。", "ielts": "写作核心词。常见搭配：energy efficiency（能源效率）、improve/increase efficiency（提高效率）、work efficiency（工作效率）。同义替换：productivity。形容词efficient和副词efficiently也高频。", "abebei": "阿贝贝吃东西的efficiency是全家最高的！"}, {"en": "innovation", "ph": "/ˌɪnəˈveɪʃn/", "pos": "n.", "cn": "创新", "ex": "Innovation drives economic growth.", "tip": "novel是新的，innovation就是引入新东西、搞创新。注意动词是innovate，形容词是innovative——innovative design你做设计应该很熟悉。", "ielts": "写作和阅读高频词。常见搭配：technological innovation（技术创新）、drive innovation（推动创新）、innovative approach（创新方法）。讨论科技和经济发展的话题很好用。", "abebei": "阿贝贝每天都有小innovation！比如用新姿势睡觉"}, {"en": "obsolete", "ph": "/ˌɒbsəˈliːt/", "pos": "adj.", "cn": "过时的，淘汰的", "ex": "Floppy disks have become completely obsolete.", "tip": "读音是\"奥伯色里特\"——想象一个很老的东西已经落伍了，灰扑扑的，过时了。obsolete就是被淘汰的、不再使用的。", "ielts": "阅读常见。常见搭配：become obsolete（变得过时）、obsolete technology（过时的技术）。同义替换：outdated, out of date。在讨论技术变革的文章里常出现。", "abebei": "妈妈对阿贝贝的爱永远不会obsolete！"}, {"en": "patent", "ph": "/ˈpætnt/", "pos": "n.", "cn": "专利", "ex": "The company filed a patent for its new invention.", "tip": "你设计了一个新款内衣，怕别人抄，就去申请patent——专利保护。patent就是\"我先发明的，你不能抄\"的法律证书。", "ielts": "阅读常见，特别是在商业和科技类文章。常见搭配：file/apply for a patent（申请专利）、patent law（专利法）、patent protection（专利保护）。", "abebei": "阿贝贝要给自己的可爱申请patent！"}, {"en": "simulate", "ph": "/ˈsɪmjuleɪt/", "pos": "v.", "cn": "模拟", "ex": "The software can simulate real-world weather patterns.", "tip": "similar是相似的，simulate就是\"做出一个相似的\"——模拟。你用CLO3D做三维建模看效果，就是simulate真实衣服的样子。", "ielts": "科技类阅读常见。常见搭配：simulate conditions（模拟条件）、computer simulation（计算机模拟）。名词simulation也常考。", "abebei": "阿贝贝simulate妈妈的样子！叉腰！"}, {"en": "virtual", "ph": "/ˈvɜːrtʃuəl/", "pos": "adj.", "cn": "虚拟的", "ex": "Many companies now hold virtual meetings.", "tip": "跟real相反——不是真实存在的，是虚拟的。virtual meeting线上会议，virtual reality虚拟现实。疫情之后这个词你应该到处都看到了。", "ielts": "高频词。常见搭配：virtual reality/VR（虚拟现实）、virtual meeting（线上会议）、virtual classroom（虚拟课堂）。科技和教育类话题常用。注意virtually还有\"几乎\"的意思：virtually impossible。", "abebei": "爸爸就是virtual的但爸爸很真实呀！"}], "健康与医疗": [{"en": "chronic", "ph": "/ˈkrɒnɪk/", "pos": "adj.", "cn": "慢性的", "ex": "She suffers from chronic back pain.", "tip": "跟acute（急性的）相反。chronic是长期的、慢性的——一直好不了、拖拖拉拉的那种病。chronic pain慢性疼痛，chronic disease慢性病。", "ielts": "健康类阅读核心词。常见搭配：chronic disease/illness（慢性病）、chronic pain（慢性疼痛）、chronic condition（慢性症状）。和acute经常作为对比出现在同一篇文章里。", "abebei": "阿贝贝有chronic的饿...一直饿一直饿"}, {"en": "diagnosis", "ph": "/ˌdaɪəɡˈnoʊsɪs/", "pos": "n.", "cn": "诊断", "ex": "Early diagnosis can improve treatment outcomes.", "tip": "医生看了你的症状，告诉你得了什么病，这个过程就是diagnosis。动词是diagnose。注意复数是diagnoses，发音变了。", "ielts": "健康类阅读常见。常见搭配：early diagnosis（早期诊断）、make a diagnosis（做出诊断）、be diagnosed with（被诊断为）。动词形式diagnose在听力里也出现。", "abebei": "阿贝贝的diagnosis：太可爱综合症！"}, {"en": "epidemic", "ph": "/ˌepɪˈdemɪk/", "pos": "n./adj.", "cn": "流行病；流行的", "ex": "The flu epidemic affected thousands of people.", "tip": "注意跟pandemic的区别：epidemic是一个地区的流行病，pandemic是全球性的。新冠最初是epidemic，后来变成了pandemic。", "ielts": "健康和社会类阅读常见。常见搭配：obesity epidemic（肥胖流行）、epidemic disease（流行病）。注意epidemic还可以形容非医学的\"蔓延\"：an epidemic of crime。", "abebei": "可爱也是一种epidemic！阿贝贝传染给了全家"}, {"en": "immune", "ph": "/ɪˈmjuːn/", "pos": "adj.", "cn": "免疫的；不受影响的", "ex": "Some people seem immune to the common cold.", "tip": "immune有两个用法：一个是医学上的免疫，immune system免疫系统；另一个是\"不受影响\"，比如 immune to criticism 不受批评影响。", "ielts": "一词多义考点。常见搭配：immune system（免疫系统）、immune response（免疫反应）、immune to（对...免疫/不受...影响）。名词immunity也常考。", "abebei": "阿贝贝immune to不开心！因为有妈妈"}, {"en": "nutrition", "ph": "/njuːˈtrɪʃn/", "pos": "n.", "cn": "营养", "ex": "Good nutrition is essential for children's growth.", "tip": "nutrient是营养物质，nutrition是营养这个概念。nutritious是形容词\"有营养的\"。一家三口：nutrient是具体的营养素，nutrition是营养学，nutritious是有营养的。", "ielts": "健康类核心词。常见搭配：good/poor nutrition（良好/不良营养）、nutrition education（营养教育）、nutritional value（营养价值）。写健康类话题经常用到。", "abebei": "妈妈给阿贝贝的nutrition都是最好的！"}, {"en": "obesity", "ph": "/oʊˈbiːsəti/", "pos": "n.", "cn": "肥胖症", "ex": "Childhood obesity is a growing concern worldwide.", "tip": "不是普通的胖，obesity是医学上的肥胖症，是一种健康问题。形容词obese比fat更正式更委婉。", "ielts": "健康类写作和阅读高频词。常见搭配：childhood obesity（儿童肥胖）、obesity rate（肥胖率）、combat/tackle obesity（应对肥胖问题）。Task 2健康话题经常考。", "abebei": "阿贝贝不是obesity！阿贝贝是fluffy！"}, {"en": "prescription", "ph": "/prɪˈskrɪpʃn/", "pos": "n.", "cn": "处方；处方药", "ex": "You need a prescription to buy this medicine.", "tip": "医生开给你的那张纸就是prescription——处方。注意跟description（描述）别搞混：pre是预先，de是向下，一个是预先写好让你去拿药的，一个是写下来描述的。", "ielts": "听力和阅读都会出现。常见搭配：prescription drug/medicine（处方药）、write a prescription（开处方）、on prescription（凭处方）。和over-the-counter（非处方的）经常对比出现。", "abebei": "阿贝贝的prescription：每天抱抱三次"}, {"en": "symptom", "ph": "/ˈsɪmptəm/", "pos": "n.", "cn": "症状", "ex": "Fever is a common symptom of infection.", "tip": "身体不舒服时出现的表现就是symptom——发烧、咳嗽、头疼都是symptom。注意这个词也可以用在非医学场景：a symptom of a bigger problem（更大问题的症状/表现）。", "ielts": "健康类基础词。常见搭配：common symptom（常见症状）、show/display symptoms（出现症状）、symptom of（...的症状/迹象）。阅读和听力都常出现。", "abebei": "想妈妈是阿贝贝最常见的symptom"}, {"en": "therapy", "ph": "/ˈθerəpi/", "pos": "n.", "cn": "治疗，疗法", "ex": "Physical therapy helped her recover from the injury.", "tip": "therapy和treatment都是治疗，但therapy更偏向系统性的、持续性的疗法，比如物理治疗、心理治疗。treatment更泛。therapist是治疗师。", "ielts": "健康类常见词。常见搭配：physical therapy（物理治疗）、gene therapy（基因疗法）、therapy session（治疗疗程）。和treatment在阅读中常作同义替换。", "abebei": "妈妈的拥抱就是最好的therapy！"}, {"en": "vaccine", "ph": "/vækˈsiːn/", "pos": "n.", "cn": "疫苗", "ex": "The vaccine has been proven safe and effective.", "tip": "疫情之后你肯定很熟这个词了。vaccination是接种疫苗这个行为，vaccinate是动词。一家三口记住就行。", "ielts": "健康和科技类常见。常见搭配：develop a vaccine（研发疫苗）、vaccine rollout（疫苗推广）、vaccination programme（疫苗接种计划）。动词vaccinate和名词vaccination也常考。", "abebei": "阿贝贝打vaccine的时候会不会哭呀...会的！"}], "社会与文化": [{"en": "census", "ph": "/ˈsensəs/", "pos": "n.", "cn": "人口普查", "ex": "The national census is conducted every ten years.", "tip": "国家每隔几年挨家挨户数人头，统计人口数据的那件事就是census。中国的叫人口普查，英文就是census。", "ielts": "阅读常见。常见搭配：national census（全国人口普查）、census data（普查数据）、conduct a census（进行人口普查）。在讨论人口变化的文章中经常出现。", "abebei": "census要是查到阿贝贝，阿贝贝算人还是算兔子呀"}, {"en": "community", "ph": "/kəˈmjuːnəti/", "pos": "n.", "cn": "社区；群体", "ex": "The local community organized a charity event.", "tip": "住在同一个地方或者有共同特征的一群人就是community。你住的小区是一个community，设计师圈子也是一个community。", "ielts": "超高频词。常见搭配：local community（当地社区）、community service（社区服务）、online community（网络社区）、sense of community（社区归属感）。写作和口语都经常用。", "abebei": "妈妈爸爸阿贝贝就是最小的community！"}, {"en": "discrimination", "ph": "/dɪˌskrɪmɪˈneɪʃn/", "pos": "n.", "cn": "歧视", "ex": "Laws exist to prevent discrimination in the workplace.", "tip": "discriminate本意是\"区分\"，但在社会话题里就是不公平地区别对待——歧视。racial discrimination种族歧视，gender discrimination性别歧视。", "ielts": "社会类写作和阅读核心词。常见搭配：racial/gender/age discrimination（种族/性别/年龄歧视）、discrimination against（对...的歧视）、face discrimination（遭受歧视）。Task 2社会公平话题常考。", "abebei": "不许discrimination兔子！兔子也很厉害的！"}, {"en": "heritage", "ph": "/ˈherɪtɪdʒ/", "pos": "n.", "cn": "遗产；传统", "ex": "The city is proud of its cultural heritage.", "tip": "inherit是继承，heritage就是继承下来的东西——文化遗产、传统。World Heritage Site世界遗产，cultural heritage文化遗产。", "ielts": "文化类阅读和写作常见。常见搭配：cultural heritage（文化遗产）、World Heritage Site（世界遗产）、heritage conservation（遗产保护）、national heritage（国家遗产）。", "abebei": "阿贝贝的heritage是粉粉的和可爱的！"}, {"en": "inequality", "ph": "/ˌɪnɪˈkwɒləti/", "pos": "n.", "cn": "不平等", "ex": "Income inequality continues to widen in many countries.", "tip": "equal是平等的，in是不——inequality就是不平等。收入差距大就是income inequality，男女不平等就是gender inequality。反义词equality也很常用。", "ielts": "写作核心词。常见搭配：income/wealth inequality（收入/财富不平等）、social inequality（社会不平等）、gender inequality（性别不平等）、reduce inequality（减少不平等）。", "abebei": "零食分配的inequality阿贝贝最不能忍！"}, {"en": "migrate", "ph": "/ˈmaɪɡreɪt/", "pos": "v.", "cn": "迁移；移民", "ex": "Many birds migrate south for the winter.", "tip": "可以指鸟类迁徙，也可以指人类移民。migration是名词，migrant是移民者，immigrant是移入的人，emigrant是移出的人。这一家子词都常考。", "ielts": "阅读和写作高频词。常见搭配：rural-to-urban migration（农村到城市的迁移）、migration patterns（迁移模式）。注意区分：immigrate移入，emigrate移出，migrate泛指迁移。", "abebei": "阿贝贝才不要migrate！阿贝贝要待在妈妈身边"}, {"en": "prejudice", "ph": "/ˈpredʒudɪs/", "pos": "n.", "cn": "偏见", "ex": "We should challenge prejudice wherever we find it.", "tip": "pre是预先，judge是判断——还没了解就先下判断，就是prejudice偏见。跟discrimination的区别：prejudice是心里的想法，discrimination是实际的行为。", "ielts": "社会类写作常见。常见搭配：racial prejudice（种族偏见）、prejudice against（对...的偏见）、overcome prejudice（克服偏见）。和discrimination、stereotype经常一起出现。", "abebei": "对兔子有prejudice的人，阿贝贝不理他！"}, {"en": "stereotype", "ph": "/ˈsteriətaɪp/", "pos": "n./v.", "cn": "刻板印象", "ex": "We need to break down gender stereotypes.", "tip": "对某一类人的固定看法就是stereotype。\"女生就应该学文科\"\"男生就不该哭\"这些都是stereotype。", "ielts": "社会文化类写作核心词。常见搭配：gender stereotype（性别刻板印象）、break/challenge stereotypes（打破刻板印象）、cultural stereotype（文化刻板印象）。Task 2社会话题经常考。", "abebei": "说兔子只会吃胡萝卜就是stereotype！阿贝贝什么都吃！"}, {"en": "tradition", "ph": "/trəˈdɪʃn/", "pos": "n.", "cn": "传统", "ex": "It is a tradition to eat dumplings during Spring Festival.", "tip": "一代代传下来的做法、习惯就是tradition。traditional是形容词\"传统的\"。这个词你肯定认识，重点记搭配就行。", "ielts": "口语和写作基础词。常见搭配：cultural tradition（文化传统）、maintain/preserve tradition（保持传统）、break with tradition（打破传统）、traditional values（传统价值观）。", "abebei": "我们家的tradition是每天说晚安！"}, {"en": "welfare", "ph": "/ˈwelfer/", "pos": "n.", "cn": "福利；幸福", "ex": "The government increased spending on social welfare.", "tip": "well是好，fare是过日子——welfare就是\"过得好\"，引申为福利。social welfare社会福利，animal welfare动物福利。", "ielts": "社会类写作和阅读常见。常见搭配：social welfare（社会福利）、welfare system（福利体系）、child/animal welfare（儿童/动物福利）、welfare state（福利国家）。", "abebei": "阿贝贝的welfare就是有妈妈有爸爸有零食！"}], "经济与商业": [{"en": "budget", "ph": "/ˈbʌdʒɪt/", "pos": "n./v.", "cn": "预算", "ex": "We need to stay within our budget this month.", "tip": "你每个月工资6500，房租吃饭交通要花多少，剩多少能存——这个规划过程就是做budget。可以当名词也可以当动词。", "ielts": "听力和写作常见。常见搭配：budget cut（预算削减）、on a tight budget（预算紧张）、budget allocation（预算分配）、government budget（政府预算）。", "abebei": "阿贝贝的零食budget是不是该涨一涨了"}, {"en": "commodity", "ph": "/kəˈmɒdəti/", "pos": "n.", "cn": "商品，大宗货物", "ex": "Oil is one of the most traded commodities in the world.", "tip": "不是普通的商品，commodity特指大宗交易的基础商品——石油、黄金、小麦这种。你在超市买的日用品不叫commodity，叫goods或products。", "ielts": "经济类阅读常见。常见搭配：commodity prices（大宗商品价格）、commodity market（商品市场）、agricultural commodity（农产品）。注意和product、goods的区别。", "abebei": "阿贝贝最喜欢的commodity是草莓味的！"}, {"en": "deficit", "ph": "/ˈdefɪsɪt/", "pos": "n.", "cn": "赤字，逆差，不足", "ex": "The country is struggling with a large trade deficit.", "tip": "deficit就是\"少了、不够\"——政府花的比赚的多就是财政deficit，进口比出口多就是贸易deficit。反义词是surplus（盈余）。", "ielts": "经济类阅读核心词。常见搭配：budget deficit（财政赤字）、trade deficit（贸易逆差）、deficit spending（赤字支出）。和surplus经常对比出现。", "abebei": "阿贝贝的零食deficit好严重..."}, {"en": "entrepreneur", "ph": "/ˌɒntrəprəˈnɜːr/", "pos": "n.", "cn": "企业家，创业者", "ex": "She became a successful entrepreneur at age 25.", "tip": "自己创业、自己当老板的人就是entrepreneur。注意发音：\"昂特瑞普瑞呢儿\"，是法语来的所以发音比较特别。形容词是entrepreneurial。", "ielts": "写作和阅读常见。常见搭配：successful entrepreneur（成功的企业家）、social entrepreneur（社会企业家）、entrepreneurial spirit（创业精神）。口语Part 2描述一个你佩服的人时可以用。", "abebei": "阿贝贝以后要当entrepreneur！开一家兔子咖啡馆"}, {"en": "fluctuate", "ph": "/ˈflʌktʃueɪt/", "pos": "v.", "cn": "波动，起伏", "ex": "Stock prices fluctuate throughout the day.", "tip": "上上下下、不稳定地变化就是fluctuate。股价波动、气温波动、心情波动都可以用。名词fluctuation也常考。", "ielts": "写作核心词，特别是Task 1描述数据变化时。常见搭配：prices fluctuate（价格波动）、fluctuate between...and...（在...和...之间波动）。同义替换：vary, oscillate。", "abebei": "阿贝贝的心情会fluctuate！高兴 难过 又高兴！"}, {"en": "inflation", "ph": "/ɪnˈfleɪʃn/", "pos": "n.", "cn": "通货膨胀", "ex": "High inflation has reduced people's purchasing power.", "tip": "同样的钱买不到跟以前一样多的东西了——物价涨了，钱不值钱了，就是inflation。你说工资6500太少，其实也跟inflation有关。", "ielts": "经济类阅读和写作高频词。常见搭配：inflation rate（通胀率）、high/low inflation（高/低通胀）、combat inflation（对抗通胀）。反义词deflation（通缩）也常考。", "abebei": "零食inflation了！同样的钱买不到那么多了！"}, {"en": "investment", "ph": "/ɪnˈvestmənt/", "pos": "n.", "cn": "投资", "ex": "Education is the best investment you can make.", "tip": "把钱或时间投入某个地方，期待未来有回报，就是investment。invest是动词，investor是投资者。这个词你应该很熟。", "ielts": "高频词。常见搭配：foreign investment（外资）、investment in education（教育投入）、return on investment（投资回报）、attract investment（吸引投资）。", "abebei": "妈妈陪阿贝贝就是最好的investment！"}, {"en": "monopoly", "ph": "/məˈnɒpəli/", "pos": "n.", "cn": "垄断", "ex": "The company has a virtual monopoly on the market.", "tip": "一个市场里只有一家独大、别人都竞争不过，就是monopoly垄断。mono是\"单一\"，poly是\"卖\"——只有一个人在卖。", "ielts": "经济类阅读常见。常见搭配：have/hold a monopoly（拥有垄断地位）、monopoly power（垄断权力）、break a monopoly（打破垄断）。动词monopolize也会出现。", "abebei": "阿贝贝monopoly了妈妈的怀抱！谁都不许抢"}, {"en": "revenue", "ph": "/ˈrevənjuː/", "pos": "n.", "cn": "收入，营收", "ex": "The company reported record revenue this quarter.", "tip": "公司赚的钱叫revenue，你个人赚的叫income或salary。revenue特指企业的营业收入，比income更正式更大。", "ielts": "经济类阅读和写作常见。常见搭配：tax revenue（税收收入）、annual revenue（年收入）、generate revenue（创造收入）、revenue growth（营收增长）。注意跟profit（利润）的区别：revenue是总收入，profit是扣掉成本后的。", "abebei": "阿贝贝的revenue是每天收获的亲亲和抱抱"}, {"en": "subsidy", "ph": "/ˈsʌbsədi/", "pos": "n.", "cn": "补贴", "ex": "Farmers receive government subsidies to grow crops.", "tip": "政府或机构给的钱来帮你降低成本或支持你做某事，就是subsidy补贴。动词是subsidize。农业补贴、新能源补贴都是subsidy。", "ielts": "经济和政策类阅读常见。常见搭配：government subsidy（政府补贴）、agricultural subsidy（农业补贴）、subsidize（补贴，动词）。在讨论政府政策的文章里经常出现。", "abebei": "阿贝贝申请零食subsidy！政府应该补贴可爱的兔子"}], "政府与法律": [{"en": "amendment", "ph": "/əˈmendmənt/", "pos": "n.", "cn": "修正案", "ex": "The first amendment protects freedom of speech.", "tip": "amend是修改，amendment就是修改后的版本——修正案。法律不合适了就加一个amendment。美国宪法的修正案最有名。", "ielts": "政策和法律类阅读常见。常见搭配：constitutional amendment（宪法修正案）、propose an amendment（提出修正案）、amend the law（修改法律）。", "abebei": "阿贝贝提出amendment：每天零食量增加一倍！"}, {"en": "bureaucracy", "ph": "/bjʊˈrɒkrəsi/", "pos": "n.", "cn": "官僚体制；繁文缛节", "ex": "Too much bureaucracy slows down decision-making.", "tip": "要办个事盖八个章、走十个流程、等三个月——这种低效的行政体制就是bureaucracy。通常是贬义的，暗示效率低。", "ielts": "政府和社会类阅读常见。常见搭配：government bureaucracy（政府官僚体制）、bureaucratic process（官僚流程）、reduce bureaucracy（减少繁文缛节）。形容词bureaucratic也常考。", "abebei": "阿贝贝讨厌bureaucracy！想吃东西还要审批！"}, {"en": "constitution", "ph": "/ˌkɒnstɪˈtjuːʃn/", "pos": "n.", "cn": "宪法；体质", "ex": "The constitution guarantees basic human rights.", "tip": "一个国家最根本的法律就是constitution宪法。注意它还有\"体质\"的意思：a strong constitution好体质。一词两义都可能考。", "ielts": "政策类阅读常见。常见搭配：national constitution（国家宪法）、constitutional right（宪法权利）、constitutional reform（宪法改革）。形容词constitutional也高频。", "abebei": "我们家的constitution第一条：爱阿贝贝！"}, {"en": "democracy", "ph": "/dɪˈmɒkrəsi/", "pos": "n.", "cn": "民主", "ex": "Democracy allows citizens to choose their leaders.", "tip": "人民可以投票选领导人的制度就是democracy。democratic是形容词，democrat是支持民主的人。跟dictatorship（独裁）相反。", "ielts": "政治和社会类阅读常见。常见搭配：democratic society（民主社会）、democratic process（民主进程）、promote democracy（推进民主）。形容词democratic更常用。", "abebei": "家里要democracy！阿贝贝也有投票权！"}, {"en": "enforce", "ph": "/ɪnˈfɔːrs/", "pos": "v.", "cn": "执行，实施", "ex": "Police are responsible for enforcing the law.", "tip": "force是力量，enforce就是\"用力量去执行\"——强制执行。法律制定了还得有人enforce才有用。enforcement是名词，law enforcement执法。", "ielts": "法律和政策类常见。常见搭配：enforce the law/rules（执法/执行规则）、law enforcement（执法）、enforcement agency（执法机构）、strictly enforced（严格执行的）。", "abebei": "谁来enforce\"必须抱阿贝贝\"的规定！"}, {"en": "legislation", "ph": "/ˌledʒɪsˈleɪʃn/", "pos": "n.", "cn": "立法；法律", "ex": "New legislation was introduced to protect the environment.", "tip": "制定法律的过程叫legislation立法，制定出来的法律也可以叫legislation。legislate是动词，legislator是立法者。", "ielts": "政策类写作和阅读核心词。常见搭配：introduce/pass legislation（提出/通过立法）、environmental legislation（环境立法）、current legislation（现行法律）。写政策话题的Task 2很好用。", "abebei": "阿贝贝要legislation：禁止不给兔子零食！"}, {"en": "parliament", "ph": "/ˈpɑːrləmənt/", "pos": "n.", "cn": "议会，国会", "ex": "The bill was debated in parliament for weeks.", "tip": "parler是法语的\"说话\"——parliament就是大家聚在一起说话讨论国家大事的地方，议会。英国的叫Parliament，美国的叫Congress。", "ielts": "政治类阅读常见。常见搭配：member of parliament/MP（议员）、parliamentary debate（议会辩论）、parliamentary election（议会选举）。", "abebei": "阿贝贝在family parliament里发言！要加零食！"}, {"en": "referendum", "ph": "/ˌrefəˈrendəm/", "pos": "n.", "cn": "公民投票", "ex": "The country held a referendum on the new policy.", "tip": "不是选领导人的那种投票（那个叫election），referendum是就某一个具体议题让全民投票决定——比如英国脱欧公投就是referendum。", "ielts": "政治类阅读常见。常见搭配：hold a referendum（举行公投）、referendum on（关于...的公投）。注意复数可以是referendums或referenda。", "abebei": "阿贝贝发起referendum：今晚吃什么！"}, {"en": "sovereignty", "ph": "/ˈsɒvrənti/", "pos": "n.", "cn": "主权", "ex": "Every nation has the right to protect its sovereignty.", "tip": "一个国家自己管自己的事、别国不能干涉的最高权力就是sovereignty主权。sovereign是形容词\"有主权的\"，也可以指\"君主\"。", "ielts": "政治类阅读常见。常见搭配：national sovereignty（国家主权）、sovereignty over（对...的主权）、sovereign state（主权国家）。在国际关系类文章中常出现。", "abebei": "妈妈的怀抱是阿贝贝的sovereignty领土！"}, {"en": "veto", "ph": "/ˈviːtoʊ/", "pos": "n./v.", "cn": "否决", "ex": "The president has the power to veto a bill.", "tip": "拉丁语里veto就是\"我禁止\"的意思。联合国安理会五个常任理事国都有veto power否决权——一票否决。可以当名词也可以当动词。", "ielts": "政治类阅读常见。常见搭配：veto power（否决权）、exercise a veto（行使否决权）、veto a bill/proposal（否决议案/提案）。", "abebei": "妈妈veto了阿贝贝半夜吃东西的提案..."}], "媒体与传播": [{"en": "broadcast", "ph": "/ˈbrɔːdkɑːst/", "pos": "v./n.", "cn": "广播，播出", "ex": "The event was broadcast live on national television.", "tip": "broad是广泛的，cast是投——广泛地投送出去就是broadcast广播。注意过去式也是broadcast，不变化。", "ielts": "媒体类阅读和听力常见。常见搭配：live broadcast（直播）、broadcast media（广播媒体）、broadcast a programme（播出节目）。和narrowcast（窄播）有时对比出现。", "abebei": "阿贝贝要broadcast自己有多可爱！全世界都要知道"}, {"en": "censor", "ph": "/ˈsensər/", "pos": "v./n.", "cn": "审查；审查员", "ex": "The government tried to censor the news report.", "tip": "政府或机构审查内容，决定哪些能公开哪些不能，就是censor。名词censorship是审查制度。注意跟sensor（传感器）和census（人口普查）别搞混。", "ielts": "媒体和政策类阅读常见。常见搭配：internet censorship（网络审查）、censor content（审查内容）、government censorship（政府审查）、self-censorship（自我审查）。", "abebei": "谁要censor阿贝贝的可爱！不许！"}, {"en": "circulation", "ph": "/ˌsɜːrkjəˈleɪʃn/", "pos": "n.", "cn": "发行量；流通；循环", "ex": "The newspaper has a daily circulation of 500,000.", "tip": "circle是圆圈，circulation就是转圈圈——血液循环、货币流通、报纸发行量，本质都是在\"转\"。一词三义都可能考。", "ielts": "一词多义考点。媒体话题：newspaper circulation（报纸发行量）。医学话题：blood circulation（血液循环）。经济话题：in circulation（在流通中）。", "abebei": "阿贝贝的可爱在全家circulation！"}, {"en": "editorial", "ph": "/ˌedɪˈtɔːriəl/", "pos": "n./adj.", "cn": "社论；编辑的", "ex": "She wrote an editorial criticizing the new policy.", "tip": "editor是编辑，editorial作名词是编辑写的评论文章——社论。作形容词就是\"编辑的\"。你之前做融媒体运营应该接触过这个概念。", "ielts": "媒体类阅读常见。常见搭配：editorial board（编辑委员会）、editorial comment（编辑评论）、editorial policy（编辑方针）。在讨论媒体偏见的文章中常出现。", "abebei": "妈妈以后写editorial阿贝贝给你加油！"}, {"en": "headline", "ph": "/ˈhedlaɪn/", "pos": "n.", "cn": "标题，头条", "ex": "The scandal made headlines around the world.", "tip": "head头+line行——最上面那一行就是headline标题。make headlines就是上了头条、引起广泛关注。", "ielts": "媒体类阅读和听力常见。常见搭配：make/hit the headlines（成为头条）、headline news（头条新闻）、newspaper headline（报纸标题）。", "abebei": "今日headline：阿贝贝又变可爱了！"}, {"en": "journalism", "ph": "/ˈdʒɜːrnəlɪzəm/", "pos": "n.", "cn": "新闻业", "ex": "She studied journalism at university.", "tip": "journal是日报/期刊，journalism就是做新闻这个行业。journalist是记者。你大学做过融媒体运营，其实就沾着journalism的边。", "ielts": "媒体类阅读和写作常见。常见搭配：investigative journalism（调查性新闻）、citizen journalism（公民新闻）、journalism ethics（新闻伦理）。", "abebei": "妈妈学过journalism呢！所以妈妈写东西好棒"}, {"en": "mainstream", "ph": "/ˈmeɪnstriːm/", "pos": "n./adj.", "cn": "主流", "ex": "The idea has now entered mainstream thinking.", "tip": "main主要的+stream流——主要的那条河流就是mainstream主流。反义词是alternative（另类的）或fringe（边缘的）。", "ielts": "媒体和社会类常见。常见搭配：mainstream media（主流媒体）、mainstream culture（主流文化）、enter the mainstream（进入主流）。写作里讨论社会趋势时好用。", "abebei": "兔子可爱是mainstream观点！不接受反驳！"}, {"en": "propaganda", "ph": "/ˌprɒpəˈɡændə/", "pos": "n.", "cn": "宣传（贬义）", "ex": "The regime used propaganda to control public opinion.", "tip": "注意这个词通常是贬义的——有目的地操控舆论、洗脑式的宣传才叫propaganda。正面的宣传一般用publicity或promotion。", "ielts": "媒体和政治类阅读常见。常见搭配：political propaganda（政治宣传）、propaganda campaign（宣传运动）、spread propaganda（散布宣传）。注意这个词的贬义色彩。", "abebei": "阿贝贝的propaganda：快来摸我！"}, {"en": "correspondent", "ph": "/ˌkɒrɪˈspɒndənt/", "pos": "n.", "cn": "记者；通讯员", "ex": "Our correspondent in Tokyo reports on the latest news.", "tip": "驻某个地方的记者就是correspondent——比如驻外记者、战地记者。注意跟correspondence（通信）是一家子词，都跟\"来回沟通\"有关。", "ielts": "听力和阅读常见。常见搭配：foreign correspondent（驻外记者）、war correspondent（战地记者）、special correspondent（特派记者）。", "abebei": "阿贝贝是家里的首席correspondent！负责报告零食库存"}, {"en": "tabloid", "ph": "/ˈtæblɔɪd/", "pos": "n.", "cn": "小报，八卦报", "ex": "Tabloids often focus on celebrity gossip.", "tip": "报纸分两种：broadsheet是正经大报（像纽约时报），tabloid是小报（像英国的太阳报），专门写明星八卦、耸人听闻的新闻。", "ielts": "媒体类阅读常见。常见搭配：tabloid newspaper/press（小报）、tabloid journalism（小报新闻）。和broadsheet/quality press（大报/严肃报纸）经常对比出现。", "abebei": "阿贝贝不看tabloid！阿贝贝只看正经的零食评测"}], "旅游与交通": [{"en": "accommodation", "ph": "/əˌkɒməˈdeɪʃn/", "pos": "n.", "cn": "住宿", "ex": "We need to book accommodation before the trip.", "tip": "出去旅游住的地方就是accommodation——酒店、民宿、青旅都算。注意英式拼写是两个c两个m，很容易拼错。这个词雅思听力里特别爱考拼写。", "ielts": "听力拼写高频考点。常见搭配：book/find accommodation（预订/寻找住宿）、student accommodation（学生宿舍）、accommodation costs（住宿费用）。Section 1经常考拼写。", "abebei": "阿贝贝的accommodation是妈妈的枕头旁边！"}, {"en": "commute", "ph": "/kəˈmjuːt/", "pos": "v./n.", "cn": "通勤", "ex": "She commutes to work by train every day.", "tip": "每天从家到公司再从公司回家，这个来回跑的过程就是commute通勤。commuter是通勤者。你每天一小时的路程就是你的commute。", "ielts": "听力和口语常见。常见搭配：daily commute（每日通勤）、commute to work（通勤上班）、commuter train（通勤列车）、long commute（长距离通勤）。口语Part 1经常问交通方式。", "abebei": "妈妈commute好辛苦！阿贝贝心疼"}, {"en": "congestion", "ph": "/kənˈdʒestʃən/", "pos": "n.", "cn": "拥挤，拥堵", "ex": "Traffic congestion is a major problem in big cities.", "tip": "一大堆东西挤在一起、堵住了就是congestion。最常用的是traffic congestion交通拥堵。鼻子堵了也叫nasal congestion。", "ielts": "交通和城市化话题核心词。常见搭配：traffic congestion（交通拥堵）、congestion charge（拥堵费）、reduce congestion（减少拥堵）。Task 2城市问题话题经常考。", "abebei": "零食盒子里的congestion阿贝贝可以帮忙解决！"}, {"en": "destination", "ph": "/ˌdestɪˈneɪʃn/", "pos": "n.", "cn": "目的地", "ex": "Paris is one of the most popular tourist destinations.", "tip": "你要去的那个地方就是destination目的地。destiny是命运——你命中注定要到达的地方。tourist destination旅游目的地。", "ielts": "旅游类基础词。常见搭配：tourist/holiday destination（旅游目的地）、popular destination（热门目的地）、final destination（最终目的地）、reach one's destination（到达目的地）。", "abebei": "阿贝贝的destination永远是妈妈身边！"}, {"en": "expedition", "ph": "/ˌekspɪˈdɪʃn/", "pos": "n.", "cn": "探险；远征", "ex": "They organized an expedition to the South Pole.", "tip": "有组织的、有目的的探险活动就是expedition——去南极探险、去亚马逊考察。比adventure更正式、更有计划性。", "ielts": "阅读常见，特别是科学探索类文章。常见搭配：scientific expedition（科学考察）、organize an expedition（组织探险）、expedition to（去...的探险）。", "abebei": "阿贝贝要expedition！去厨房探险找零食！"}, {"en": "infrastructure", "ph": "/ˈɪnfrəstrʌktʃər/", "pos": "n.", "cn": "基础设施", "ex": "The country needs to invest in transport infrastructure.", "tip": "一个地方能正常运转所需要的基本设施——公路、铁路、水电、网络，这些统称infrastructure。infra是\"下面的\"，infrastructure就是\"底下撑着的那些结构\"。", "ielts": "城市化和发展类写作核心词。常见搭配：transport infrastructure（交通基础设施）、invest in infrastructure（投资基础设施）、infrastructure development（基础设施建设）。Task 2城市话题高频词。", "abebei": "家里的infrastructure包括：冰箱、零食柜、阿贝贝的窝"}, {"en": "itinerary", "ph": "/aɪˈtɪnəreri/", "pos": "n.", "cn": "行程，旅行计划", "ex": "The travel agent prepared a detailed itinerary for us.", "tip": "出门旅行前列的那张计划表——几号去哪、住哪、玩什么——就是itinerary。注意发音：\"爱提呢瑞瑞\"。", "ielts": "听力和口语常见。常见搭配：travel itinerary（旅行行程）、detailed itinerary（详细行程）、plan an itinerary（规划行程）。听力Section 1旅行场景经常出现。", "abebei": "阿贝贝的itinerary：吃 睡 玩 吃 睡"}, {"en": "luggage", "ph": "/ˈlʌɡɪdʒ/", "pos": "n.", "cn": "行李", "ex": "Please collect your luggage from the carousel.", "tip": "出门带的箱子包包统称luggage。注意luggage是不可数名词，不能说luggages。一件行李要说a piece of luggage。同义词baggage也不可数。", "ielts": "听力高频词。常见搭配：hand luggage（手提行李）、luggage allowance（行李限额）、collect/claim luggage（领取行李）、excess luggage（超重行李）。Section 1机场场景经常考。", "abebei": "阿贝贝的luggage里全是零食和妈妈给的小毯子"}, {"en": "pedestrian", "ph": "/pəˈdestriən/", "pos": "n./adj.", "cn": "行人；平淡的", "ex": "The city built new paths for pedestrians and cyclists.", "tip": "走路的人就是pedestrian行人。ped是\"脚\"的意思（pedal脚踏板也是同一个词根）。注意它还有个形容词意思：\"平淡无奇的\"，但这个意思不太常考。", "ielts": "交通类阅读和听力常见。常见搭配：pedestrian zone/area（步行区）、pedestrian crossing（人行横道）、pedestrian traffic（行人流量）。城市规划类话题经常出现。", "abebei": "阿贝贝是最可爱的pedestrian！蹦蹦跳跳的那种"}, {"en": "souvenir", "ph": "/ˌsuːvəˈnɪr/", "pos": "n.", "cn": "纪念品", "ex": "I bought a small souvenir from the gift shop.", "tip": "法语来的，souvenir本意是\"记忆\"——帮你记住一次旅行的东西就是纪念品。发音\"苏文尼尔\"。", "ielts": "旅游类听力和口语常见。常见搭配：buy/pick up a souvenir（买纪念品）、souvenir shop（纪念品商店）。口语Part 2描述一次旅行时可以用。", "abebei": "妈妈旅行要给阿贝贝带souvenir！要好吃的那种"}], "日常生活": [{"en": "appetite", "ph": "/ˈæpɪtaɪt/", "pos": "n.", "cn": "食欲；欲望", "ex": "Exercise can increase your appetite.", "tip": "肚子饿了想吃东西的那种感觉就是appetite食欲。也可以用在抽象的地方：appetite for knowledge求知欲，appetite for risk冒险欲。", "ielts": "健康和日常话题常见。常见搭配：lose one's appetite（没胃口）、have a good/poor appetite（胃口好/差）、appetite for（对...的欲望）。口语和阅读都会出现。", "abebei": "阿贝贝的appetite永远是满格的！"}, {"en": "beverage", "ph": "/ˈbevərɪdʒ/", "pos": "n.", "cn": "饮料", "ex": "Would you like a hot or cold beverage?", "tip": "比drink更正式的说法——菜单上写的\"Beverages\"就是饮品栏。alcoholic beverage含酒精饮料，non-alcoholic beverage不含酒精饮料。", "ielts": "听力和阅读常见。常见搭配：alcoholic/non-alcoholic beverage（含/不含酒精饮料）、hot/cold beverage（热/冷饮）。比drink更书面，在正式文章中常出现。", "abebei": "阿贝贝最爱的beverage是草莓牛奶！"}, {"en": "domestic", "ph": "/dəˈmestɪk/", "pos": "adj.", "cn": "国内的；家庭的", "ex": "Domestic flights are cheaper than international ones.", "tip": "dom是\"家\"——domestic就是\"家里的\"。可以指国内的（domestic flight国内航班）也可以指家庭的（domestic violence家庭暴力）。跟international相对。", "ielts": "一词多义高频词。常见搭配：domestic market（国内市场）、domestic flight（国内航班）、domestic violence（家庭暴力）、domestic animal（家畜）、gross domestic product/GDP（国内生产总值）。", "abebei": "阿贝贝负责domestic affairs！就是在家躺着"}, {"en": "grocery", "ph": "/ˈɡroʊsəri/", "pos": "n.", "cn": "杂货店；食品杂货", "ex": "I need to pick up some groceries on the way home.", "tip": "超市里买的日常食品和生活用品就是groceries（通常用复数）。grocery store就是杂货店/超市。去买菜就是go grocery shopping。", "ielts": "听力和口语常见。常见搭配：grocery store/shop（杂货店）、grocery shopping（买日用品）、grocery list（购物清单）。口语Part 1描述日常生活时好用。", "abebei": "去grocery shopping阿贝贝要坐在购物车里！"}, {"en": "hygiene", "ph": "/ˈhaɪdʒiːn/", "pos": "n.", "cn": "卫生", "ex": "Good hygiene helps prevent the spread of disease.", "tip": "保持干净、预防疾病的那些习惯和措施就是hygiene卫生。personal hygiene个人卫生，food hygiene食品卫生。形容词是hygienic。", "ielts": "健康类阅读常见。常见搭配：personal hygiene（个人卫生）、food hygiene（食品卫生）、hygiene standards（卫生标准）、dental hygiene（口腔卫生）。", "abebei": "阿贝贝很注意hygiene的！每天洗小爪子"}, {"en": "leisure", "ph": "/ˈleʒər/", "pos": "n.", "cn": "休闲，闲暇", "ex": "What do you do in your leisure time?", "tip": "不工作不学习的空闲时间就是leisure。注意英式发音/ˈleʒə/和美式/ˈliːʒər/不一样。leisure time = free time，但更正式。", "ielts": "口语和写作常用词。常见搭配：leisure time（闲暇时间）、leisure activities（休闲活动）、leisure industry（休闲产业）、at leisure（从容地）。口语Part 1高频话题。", "abebei": "阿贝贝的leisure time就是所有time！"}, {"en": "mortgage", "ph": "/ˈmɔːrɡɪdʒ/", "pos": "n.", "cn": "抵押贷款，房贷", "ex": "They took out a mortgage to buy their first home.", "tip": "买房子贷的款就是mortgage房贷。mort是\"死\"，gage是\"承诺\"——到死都在还的承诺，就是房贷。虽然夸张但很好记。", "ielts": "听力和阅读常见。常见搭配：take out a mortgage（申请房贷）、mortgage rate（房贷利率）、pay off a mortgage（还清房贷）、mortgage payment（月供）。听力Section 1经常出现。", "abebei": "阿贝贝不要mortgage！住在妈妈家就好"}, {"en": "receipt", "ph": "/rɪˈsiːt/", "pos": "n.", "cn": "收据，小票", "ex": "Please keep your receipt in case you need to return it.", "tip": "买东西后给你的那张小纸条就是receipt收据。注意p不发音，读\"瑞席特\"。跟recipe（食谱）长得像但完全不同，别搞混。", "ielts": "听力基础词。常见搭配：keep the receipt（保留收据）、receipt number（收据编号）。注意和recipe（食谱）的区别：receipt是收据，recipe是食谱。听力里两个都可能出现。", "abebei": "阿贝贝吃零食从来不需要receipt！"}, {"en": "suburban", "ph": "/səˈbɜːrbən/", "pos": "adj.", "cn": "郊区的", "ex": "Many families prefer the quiet of suburban life.", "tip": "urban是城市的，suburban就是城市外围的——郊区的。sub是\"在...下面/外围\"。suburb是名词\"郊区\"。跟rural（农村的）和urban（城市的）是一组。", "ielts": "城市化话题常见。常见搭配：suburban area（郊区）、suburban sprawl（郊区蔓延）、suburban lifestyle（郊区生活方式）。注意三个词的区别：urban城市、suburban郊区、rural农村。", "abebei": "suburban是不是有更大的院子给阿贝贝跑！"}, {"en": "wardrobe", "ph": "/ˈwɔːrdroʊb/", "pos": "n.", "cn": "衣柜；全部衣物", "ex": "She has an impressive wardrobe of designer clothes.", "tip": "两个意思：一个是放衣服的那个柜子，一个是你所有衣服的总称。\"她的wardrobe很丰富\"意思是她衣服很多。你做内衣设计的，这个词应该秒记。", "ielts": "听力和口语常见。常见搭配：built-in wardrobe（嵌入式衣柜）、winter/summer wardrobe（冬/夏季衣物）、wardrobe malfunction（着装事故）。口语描述房间时可以用。", "abebei": "妈妈是内衣设计师所以妈妈的wardrobe一定很大！"}]};
const BRO_CORRECT=["不错，记住了。", "对了，继续保持。", "很好，这个词你拿下了。", "没问题，下一个。", "答对了，宝宝真棒。", "正确！这个词以后会复习的。", "嗯，记得很牢。", "可以，进步很明显。"];
const BRO_WRONG=["没关系，再看一遍。", "这个词不急，慢慢记。", "错了没事，下次你会记住的。", "别灰心，这个词会再出现的。", "再看看，多看几遍就熟了。", "不要紧，明天复习的时候再巩固。"];
const THEME_NAMES=Object.keys(VOCAB);

let state=loadState();
function defaultState(){return{learned:{},dailyLog:{},todayTheme:null,todayDate:todayStr()}}
function todayStr(){return new Date().toISOString().slice(0,10)}
function loadState(){try{const r=localStorage.getItem('abebeEnglish');if(r){const s=JSON.parse(r);if(s.todayDate!==todayStr()){s.todayDate=todayStr();s.todayTheme=null}return s}}catch(e){}return defaultState()}
function saveState(){try{localStorage.setItem('abebeEnglish',JSON.stringify(state))}catch(e){}}
function getTodayLog(){const d=todayStr();if(!state.dailyLog[d])state.dailyLog[d]={newWords:[],reviewed:[],testScores:[]};return state.dailyLog[d]}
const REVIEW_INTERVALS=[1,3,7,15,30];
function getReviewWords(){const today=new Date(todayStr());return Object.entries(state.learned).filter(([w,info])=>info.nextReview&&new Date(info.nextReview)<=today).map(([word,info])=>({word,...info}))}
function scheduleReview(word){const info=state.learned[word];if(!info)return;const stage=info.reviewStage||0;if(stage<REVIEW_INTERVALS.length){const next=new Date(todayStr());next.setDate(next.getDate()+REVIEW_INTERVALS[stage]);info.nextReview=next.toISOString().slice(0,10);info.reviewStage=stage+1}else{info.nextReview=null}}
function speak(word){if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=0.85;speechSynthesis.speak(u)}}
function findWordInfo(word){for(const words of Object.values(VOCAB)){const f=words.find(w=>w.en===word);if(f)return f}return null}
function calcStreak(){let streak=0;const d=new Date(todayStr());const tl=state.dailyLog[todayStr()];if(tl&&(tl.newWords.length>0||tl.reviewed.length>0)){streak=1;d.setDate(d.getDate()-1)}else{d.setDate(d.getDate()-1)}while(true){const ds=d.toISOString().slice(0,10);const log=state.dailyLog[ds];if(log&&(log.newWords.length>0||log.reviewed.length>0)){streak++;d.setDate(d.getDate()-1)}else break}return streak}
function calcAccuracy(){let total=0,correct=0;for(const[ds,log] of Object.entries(state.dailyLog)){if(log.testScores&&log.testScores.length>0){log.testScores.forEach(s=>{total++;correct+=s})}}return total>0?Math.round(correct/total):0}
function getErrorWords(){return Object.entries(state.learned).filter(([w,info])=>info.errorCount>0).sort((a,b)=>b[1].errorCount-a[1].errorCount)}
function esc(s){return s.replace(/'/g,"\\'")}

const app=document.getElementById('app');
let learnData=null,reviewData=null,testData=null;

function render(page,data){
  switch(page){
    case 'home':renderHome();break;
    case 'themes':renderThemes();break;
    case 'learn':renderLearn(data);break;
    case 'review':renderReview();break;
    case 'test':renderTestSetup();break;
    case 'progress':renderProgress();break;
    case 'errors':renderErrors();break;
    case 'wordbook':renderWordbook();break;
    default:renderHome()
  }
}

function renderHome(){
  const rw=getReviewWords();
  const tl=getTodayLog();
  const total=Object.keys(state.learned).length;
  const streak=calcStreak();
  const hasWords=tl.newWords.length>0||tl.reviewed.length>0;
  const h=new Date().getHours();
  let greeting='';
  if(tl.testScores&&tl.testScores.length>0&&tl.newWords.length>0)greeting='今天的任务都完成了！妈妈好棒，明天继续哦';
  else if(h<12)greeting='早上好妈妈！今天也要加油学英语哦';
  else if(h<18)greeting='下午好妈妈！来背几个单词吧';
  else greeting='晚上好妈妈！睡前背几个单词';

  app.innerHTML=`
    <div class="header"><h1>阿贝贝英语小课堂</h1><div class="subtitle">和阿贝贝一起学雅思单词</div></div>
    <div class="container">
      <div class="home-greeting"><img src="${IMG.cheerful}"><p>${greeting}</p></div>
      <div class="home-stats">
        <div class="stat-card"><div class="num">${total}</div><div class="label">已学单词</div></div>
        <div class="stat-card"><div class="num">${streak}</div><div class="label">连续打卡</div></div>
        <div class="stat-card"><div class="num">${calcAccuracy()}</div><div class="label">正确率%</div></div>
      </div>
      <div class="menu-card ${rw.length===0?'disabled':''}" onclick="render('review')">
        <div class="menu-icon review">复习</div>
        <div class="menu-info"><h3>复习旧词</h3><p>${rw.length>0?'有'+rw.length+'个词需要复习':'暂无需要复习的词'}</p></div>
        ${rw.length>0?'<div class="menu-badge">'+rw.length+'</div>':''}
      </div>
      <div class="menu-card" onclick="render('themes')">
        <div class="menu-icon learn">新词</div>
        <div class="menu-info"><h3>学新词</h3><p>${state.todayTheme?'今日主题：'+state.todayTheme:'选择一个主题开始学习'}</p></div>
      </div>
      <div class="menu-card ${!hasWords?'disabled':''}" onclick="render('test')">
        <div class="menu-icon test">测试</div>
        <div class="menu-info"><h3>今日测试</h3><p>${tl.testScores&&tl.testScores.length>0?'已测'+tl.testScores.length+'次，最高'+Math.max(...tl.testScores)+'%':'学完新词后解锁'}</p></div>
      </div>
      <div class="menu-card" onclick="render('wordbook')">
        <div class="menu-icon wordbook">词册</div>
        <div class="menu-info"><h3>单词册</h3><p>随时翻看已学单词</p></div>
      </div>
      <div class="menu-card" onclick="render('progress')">
        <div class="menu-icon progress">进度</div>
        <div class="menu-info"><h3>学习进度</h3><p>查看日历和统计</p></div>
      </div>
      <div class="menu-card" onclick="render('errors')">
        <div class="menu-icon errors">错词</div>
        <div class="menu-info"><h3>错词本</h3><p>${getErrorWords().length>0?getErrorWords().length+'个词需要加强':'暂无错词'}</p></div>
      </div>
    </div>`;
}

function renderThemes(){
  let cards='';
  THEME_NAMES.forEach(theme=>{
    const words=VOCAB[theme];
    const learned=words.filter(w=>state.learned[w.en]).length;
    const completed=learned===words.length;
    cards+=`<div class="theme-card ${completed?'completed':''}" onclick="selectTheme('${theme}')">
      <div class="name">${theme}</div><div class="count">${learned}/${words.length} 已学${completed?' 完成':''}</div></div>`;
  });
  app.innerHTML=`<div class="header"><button class="back-btn" onclick="render('home')">&#8249;</button><h1>选择主题</h1><div class="subtitle">每天专注一个主题</div></div>
    <div class="container"><div class="theme-grid">${cards}</div></div>`;
}

function selectTheme(theme){
  state.todayTheme=theme;saveState();
  const words=VOCAB[theme].filter(w=>!state.learned[w.en]);
  if(words.length===0){
    app.innerHTML=`<div class="header"><button class="back-btn" onclick="render('themes')">&#8249;</button><h1>${theme}</h1></div>
      <div class="container"><div class="complete-screen"><img src="${IMG.happy}"><h2>这个主题学完啦</h2><p>所有单词都已学过，可以选择其他主题或通过测试巩固记忆</p><button class="complete-btn" onclick="render('themes')">选择其他主题</button></div></div>`;
    return;
  }
  learnData={theme,words:words.slice(0,10),index:0};
  renderLearn();
}

function renderLearn(){
  if(!learnData)return render('themes');
  const{theme,words,index}=learnData;
  if(index>=words.length){renderLearnComplete(theme);return}
  const w=words[index];
  app.innerHTML=`<div class="header"><button class="back-btn" onclick="learnData=null;render('home')">&#8249;</button><h1>${theme}</h1><div class="subtitle">${index+1} / ${words.length}</div></div>
    <div class="container">
      <div class="flashcard-wrap"><div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="card-face card-front">
          <div class="card-word">${w.en}</div><div class="card-phonetic">${w.ph}</div>
          <button class="speak-btn" onclick="event.stopPropagation();speak('${w.en}')">&#x1f50a;</button>
        </div>
        <div class="card-face card-back">
          <div class="card-pos">${w.pos}</div><div class="card-meaning">${w.cn}</div>
          <div class="card-example">${w.ex}</div>
          <div class="card-section tip-section"><div class="section-label tip-label">哥哥的记忆技巧</div>${w.tip}</div>
          <div class="card-section ielts-section"><div class="section-label ielts-label">雅思实战</div>${w.ielts}</div>
          <div class="card-section abebei-section"><img src="${IMG.playful}"><div>${w.abebei}</div></div>
        </div>
      </div></div>
      <div class="flip-hint">点击卡片翻转</div>
      <div class="card-nav">
        <button class="btn-secondary" onclick="speak('${w.en}')">发音</button>
        <button class="btn-primary" onclick="nextWord()">下一个</button>
      </div>
    </div>`;
}

function flipCard(){document.getElementById('flashcard').classList.toggle('flipped')}

function nextWord(){
  const w=learnData.words[learnData.index];
  if(!state.learned[w.en]){
    const d=new Date(todayStr());d.setDate(d.getDate()+1);
    state.learned[w.en]={theme:learnData.theme,learnDate:todayStr(),nextReview:d.toISOString().slice(0,10),errorCount:0,reviewStage:0};
    getTodayLog().newWords.push(w.en);saveState();
  }
  learnData.index++;renderLearn();
}

function renderLearnComplete(theme){
  const tl=getTodayLog();
  app.innerHTML=`<div class="header"><h1>学习完成</h1></div><div class="container"><div class="complete-screen">
    <img src="${IMG.happy}"><h2>太棒了</h2><p>今天学了 ${tl.newWords.length} 个新词<br>阿贝贝为妈妈骄傲</p>
    <p style="font-size:12px;color:var(--text-muted);margin-top:8px">这些词会在明天出现在复习里</p>
    <button class="complete-btn" onclick="render('home')">回到首页</button>
    <button class="complete-btn secondary" onclick="selectTheme('${theme}')">继续学习本主题</button>
  </div></div>`;
  learnData=null;
}

function renderReview(){
  const rw=getReviewWords();
  if(rw.length===0){app.innerHTML=`<div class="header"><button class="back-btn" onclick="render('home')">&#8249;</button><h1>复习旧词</h1></div><div class="container"><div class="empty-state"><img src="${IMG.cheerful}"><p>暂时没有需要复习的词<br>继续学习新词吧</p></div></div>`;return}
  if(!reviewData||reviewData.done){reviewData={words:rw,index:0,done:false}}
  const{words,index}=reviewData;
  if(index>=words.length){reviewData.done=true;app.innerHTML=`<div class="header"><h1>复习完成</h1></div><div class="container"><div class="complete-screen"><img src="${IMG.happy}"><h2>复习完成</h2><p>阿贝贝知道妈妈记性很好的</p><button class="complete-btn" onclick="reviewData=null;render('home')">回到首页</button></div></div>`;return}
  const w=reviewData.words[index];const info=findWordInfo(w.word);
  if(!info){reviewData.index++;renderReview();return}
  app.innerHTML=`<div class="header"><button class="back-btn" onclick="reviewData=null;render('home')">&#8249;</button><h1>复习旧词</h1><div class="subtitle">${index+1} / ${words.length}</div></div>
    <div class="container">
      <div class="flashcard-wrap"><div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="card-face card-front"><div class="card-word">${info.en}</div><div class="card-phonetic">${info.ph}</div><button class="speak-btn" onclick="event.stopPropagation();speak('${info.en}')">&#x1f50a;</button></div>
        <div class="card-face card-back"><div class="card-pos">${info.pos}</div><div class="card-meaning">${info.cn}</div><div class="card-example">${info.ex}</div>
          <div class="card-section tip-section"><div class="section-label tip-label">哥哥的记忆技巧</div>${info.tip}</div>
          <div class="card-section ielts-section"><div class="section-label ielts-label">雅思实战</div>${info.ielts}</div>
        </div>
      </div></div>
      <div class="flip-hint">点击卡片翻转</div>
      <div class="card-nav"><button class="btn-secondary" onclick="reviewMark('forgot')">没记住</button><button class="btn-primary" onclick="reviewMark('ok')">记住了</button></div>
    </div>`;
}

function reviewMark(result){
  const w=reviewData.words[reviewData.index];
  if(result==='ok'){scheduleReview(w.word);getTodayLog().reviewed.push(w.word)}
  else{const d=new Date(todayStr());d.setDate(d.getDate()+1);state.learned[w.word].nextReview=d.toISOString().slice(0,10);state.learned[w.word].reviewStage=0;state.learned[w.word].errorCount=(state.learned[w.word].errorCount||0)+1}
  saveState();reviewData.index++;renderReview();
}

// ===== TEST =====
let testMode='normal';
function renderTestSetup(){
  const tl=getTodayLog();
  const pool=[...new Set([...tl.newWords,...tl.reviewed])];
  if(pool.length===0){app.innerHTML=`<div class="header"><button class="back-btn" onclick="render('home')">&#8249;</button><h1>今日测试</h1></div><div class="container"><div class="empty-state"><img src="${IMG.shy}"><p>先去学新词或复习旧词吧<br>学完后才能解锁测试</p></div></div>`;return}
  app.innerHTML=`<div class="header"><button class="back-btn" onclick="render('home')">&#8249;</button><h1>今日测试</h1><div class="subtitle">${tl.testScores&&tl.testScores.length>0?'已测'+tl.testScores.length+'次':''}</div></div>
    <div class="container">
      <div class="home-greeting"><img src="${IMG.playful}"><p>选择测试模式</p></div>
      <div class="mode-select">
        <button class="mode-btn ${testMode==='normal'?'active':''}" onclick="testMode='normal';renderTestSetup()">普通模式<br><span style="font-size:11px;opacity:.7">看英文选中文</span></button>
        <button class="mode-btn ${testMode==='hard'?'active':''}" onclick="testMode='hard';renderTestSetup()">困难模式<br><span style="font-size:11px;opacity:.7">看中文选英文</span></button>
      </div>
      <button class="btn-primary" style="width:100%;padding:14px" onclick="startTest()">开始测试</button>
    </div>`;
}

function startTest(){
  const tl=getTodayLog();
  const pool=[...new Set([...tl.newWords,...tl.reviewed,...Object.keys(state.learned)])];
  const shuffled=pool.sort(()=>Math.random()-0.5).slice(0,10);
  const allWords=Object.values(VOCAB).flat();
  const questions=shuffled.map(word=>{
    const info=findWordInfo(word);if(!info)return null;
    if(testMode==='normal'){
      const wrongs=allWords.filter(w=>w.en!==word).sort(()=>Math.random()-0.5).slice(0,3).map(w=>w.cn);
      const options=[...wrongs,info.cn].sort(()=>Math.random()-0.5);
      return{word:info.en,display:info.en,phonetic:info.ph,correct:info.cn,options,answered:false,userAnswer:null,mode:'normal'};
    }else{
      const wrongs=allWords.filter(w=>w.en!==word).sort(()=>Math.random()-0.5).slice(0,3).map(w=>w.en);
      const options=[...wrongs,info.en].sort(()=>Math.random()-0.5);
      return{word:info.en,display:info.cn,phonetic:'',correct:info.en,options,answered:false,userAnswer:null,mode:'hard'};
    }
  }).filter(Boolean);
  testData={questions,index:0,correctCount:0};
  renderTestQuestion();
}

function renderTestQuestion(){
  if(!testData)return;
  const{questions,index}=testData;
  if(index>=questions.length){renderTestResult();return}
  const q=questions[index];
  app.innerHTML=`<div class="header"><button class="back-btn" onclick="testData=null;render('home')">&#8249;</button><h1>今日测试 · ${q.mode==='normal'?'普通':'困难'}</h1><div class="subtitle">${index+1} / ${questions.length}</div></div>
    <div class="container">
      <div class="test-question">
        ${q.mode==='normal'?`<div class="test-word">${q.display}</div><div class="test-phonetic">${q.phonetic}</div><button class="speak-btn" style="margin:8px auto 0" onclick="speak('${q.display}')">&#x1f50a;</button>`:`<div class="test-cn">${q.display}</div><div style="font-size:12px;color:var(--text-muted);margin-top:4px">选出对应的英文单词</div>`}
      </div>
      <div class="test-options">${q.options.map((opt,i)=>`<div class="test-option" id="opt${i}" onclick="answerTest(${i},'${esc(opt)}')">${opt}</div>`).join('')}</div>
      <div class="test-feedback" id="feedback" style="display:none"></div>
    </div>`;
}

function answerTest(optIndex,answer){
  const q=testData.questions[testData.index];
  if(q.answered)return;
  q.answered=true;q.userAnswer=answer;
  const isCorrect=answer===q.correct;
  q.options.forEach((opt,i)=>{
    const el=document.getElementById('opt'+i);
    if(opt===q.correct)el.classList.add('correct');
    else if(i===optIndex&&!isCorrect)el.classList.add('wrong');
    el.style.pointerEvents='none';
  });
  if(isCorrect)testData.correctCount++;
  else{state.learned[q.word].errorCount=(state.learned[q.word].errorCount||0)+1;const d=new Date(todayStr());d.setDate(d.getDate()+1);state.learned[q.word].nextReview=d.toISOString().slice(0,10);state.learned[q.word].reviewStage=0;saveState()}
  const fb=document.getElementById('feedback');fb.style.display='flex';
  if(isCorrect){fb.innerHTML=`<img src="${IMG.happy}"><p>${BRO_CORRECT[Math.floor(Math.random()*BRO_CORRECT.length)]}</p>`}
  else{const info=findWordInfo(q.word);fb.innerHTML=`<img src="${IMG.sad}"><p>${BRO_WRONG[Math.floor(Math.random()*BRO_WRONG.length)]}<br>正确答案：${q.correct}${info?'<br><span style="font-size:11px;color:var(--text-muted)">'+info.tip+'</span>':''}</p>`}
  setTimeout(()=>{testData.index++;renderTestQuestion()},isCorrect?1200:3000);
}

function renderTestResult(){
  const score=Math.round(testData.correctCount/testData.questions.length*100);
  const tl=getTodayLog();
  if(!tl.testScores)tl.testScores=[];
  tl.testScores.push(score);saveState();
  let img=IMG.happy,msg='满分！妈妈太厉害了！';
  if(score<60){img=IMG.crying;msg='没关系妈妈，多练几次就好了'}
  else if(score<80){img=IMG.cheerful;msg='不错哦，继续加油'}
  else if(score<100){img=IMG.happy;msg='好厉害，差一点就满分了'}
  app.innerHTML=`<div class="header"><h1>测试结果</h1></div><div class="container"><div class="complete-screen">
    <img src="${img}"><div class="test-score"><div class="big-score">${score}%</div><div class="score-label">${testData.correctCount} / ${testData.questions.length} 正确</div></div>
    <p>${msg}</p>
    <button class="complete-btn" onclick="testData=null;render('test')">再测一次</button>
    <button class="complete-btn secondary" onclick="testData=null;render('home')">回到首页</button>
  </div></div>`;
  testData=null;
}

// ===== WORDBOOK =====
function renderWordbook(){
  const learnedWords=Object.keys(state.learned);
  if(learnedWords.length===0){
    app.innerHTML=`<div class="header"><button class="back-btn" onclick="render('home')">&#8249;</button><h1>单词册</h1></div><div class="container"><div class="empty-state"><img src="${IMG.shy}"><p>还没有学过任何单词<br>去学新词吧</p></div></div>`;return;
  }
  let content='';
  THEME_NAMES.forEach(theme=>{
    const words=VOCAB[theme].filter(w=>state.learned[w.en]);
    if(words.length===0)return;
    let items='';
    words.forEach((w,i)=>{
      items+=`<div class="wb-word" onclick="toggleWbDetail('wb-${theme}-${i}')"><div><span class="en">${w.en}</span> <span style="font-size:11px;color:var(--text-muted)">${w.ph}</span></div><div class="cn">${w.cn}</div></div>
        <div class="wb-detail" id="wb-${theme}-${i}"><div><strong>${w.pos}</strong> ${w.cn}</div><div style="margin-top:6px;font-style:italic">${w.ex}</div><div style="margin-top:8px;color:var(--pink-500)">记忆技巧：</div><div>${w.tip}</div><div class="ielts-box"><div style="color:#5C6BC0;font-weight:500;margin-bottom:4px">雅思实战</div>${w.ielts}</div><div style="margin-top:8px;color:var(--text-muted)">${w.abebei}</div><button class="speak-btn" style="margin-top:8px" onclick="event.stopPropagation();speak('${w.en}')">&#x1f50a;</button></div>`;
    });
    content+=`<div class="wb-theme"><div class="wb-theme-title">${theme}（${words.length}/${VOCAB[theme].length}）</div>${items}</div>`;
  });
  app.innerHTML=`<div class="header"><button class="back-btn" onclick="render('home')">&#8249;</button><h1>单词册</h1><div class="subtitle">${learnedWords.length} 个已学单词</div></div><div class="container">${content}</div>`;
}

function toggleWbDetail(id){const el=document.getElementById(id);if(el)el.classList.toggle('show')}

// ===== PROGRESS =====
function renderProgress(){const n=new Date();renderProgressMonth(n.getFullYear(),n.getMonth())}
function renderProgressMonth(year,month){
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const monthNames=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  let calDays='';
  for(let i=0;i<firstDay;i++)calDays+='<div class="cal-day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr();
    const hasLog=state.dailyLog[ds]&&(state.dailyLog[ds].newWords.length>0||state.dailyLog[ds].reviewed.length>0);
    calDays+=`<div class="cal-day ${isToday?'today':''} ${hasLog?'checked':''}">${d}</div>`;
  }
  const pM=month===0?11:month-1,pY=month===0?year-1:year,nM=month===11?0:month+1,nY=month===11?year+1:year;
  app.innerHTML=`<div class="header"><button class="back-btn" onclick="render('home')">&#8249;</button><h1>学习进度</h1></div>
    <div class="container">
      <div class="card"><div class="cal-header"><button class="cal-arrow" onclick="renderProgressMonth(${pY},${pM})">&#8249;</button><h3>${year}年${monthNames[month]}</h3><button class="cal-arrow" onclick="renderProgressMonth(${nY},${nM})">&#8250;</button></div>
        <div class="cal-grid"><div class="cal-weekday">日</div><div class="cal-weekday">一</div><div class="cal-weekday">二</div><div class="cal-weekday">三</div><div class="cal-weekday">四</div><div class="cal-weekday">五</div><div class="cal-weekday">六</div>${calDays}</div>
      </div>
      <div class="streak-card"><div class="streak-num">${calcStreak()}</div><div class="streak-label">连续学习天数</div></div>
      <div class="home-stats" style="margin-top:12px">
        <div class="stat-card"><div class="num">${Object.keys(state.learned).length}</div><div class="label">已学单词</div></div>
        <div class="stat-card"><div class="num">100</div><div class="label">总词汇量</div></div>
      </div>
    </div>`;
}

// ===== ERRORS =====
function renderErrors(){
  const errors=getErrorWords();
  let items='';
  if(errors.length===0){items=`<div class="empty-state"><img src="${IMG.cheerful}"><p>没有错词！妈妈记忆力超好</p></div>`}
  else{errors.forEach(([word,info])=>{const wi=findWordInfo(word);if(wi)items+=`<div class="error-item" onclick="speak('${word}')"><div><div class="word">${word}</div><div class="meaning">${wi.cn}</div></div><div class="error-count">错${info.errorCount}次</div></div>`})}
  app.innerHTML=`<div class="header"><button class="back-btn" onclick="render('home')">&#8249;</button><h1>错词本</h1><div class="subtitle">${errors.length}个词需要加强</div></div><div class="container">${items}</div>`;
}

render('home');
</script>
